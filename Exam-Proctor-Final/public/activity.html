<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Activity — TestGuard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav-root" data-active="activity"></div>
<script src="common.js"></script>
<main>
  <div class="page-head">
    <div>
      <h2>Live Activity</h2>
      <p>The active-window log for a session, updated every few seconds.</p>
    </div>
  </div>

  <div class="filters">
    <div class="f wide">
      <label for="session-select">Session</label>
      <select id="session-select"></select>
    </div>
    <div class="f end">
      <label><input type="checkbox" id="auto" checked>Auto-refresh (3s)</label>
      <span id="updated"></span>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Time</th><th>Student ID</th><th>Time spent</th><th>Application</th></tr></thead>
      <tbody id="log-body"></tbody>
    </table>
    <div id="empty" style="display:none;">No activity recorded for this session yet.</div>
  </div>
</main>
<script src="activity.js"></script>
</body>
</html>
