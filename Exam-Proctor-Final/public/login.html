<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — TestGuard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav-root" data-active="login"></div>
<script src="common.js"></script>
<div class="center-screen">
  <div class="auth-card">
    <div class="card">
      <h2 id="title" style="margin-bottom:4px;">Welcome back</h2>
      <p class="muted" id="subtitle" style="margin:0 0 16px;">Log in to manage your exams and see your students' sessions.</p>

      <div class="tabs">
        <button type="button" id="tab-login" class="on">Log in</button>
        <button type="button" id="tab-register">Create account</button>
      </div>

      <form id="form" autocomplete="on">
        <div id="name-row" style="display:none;">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" placeholder="e.g. Prof. Dela Cruz">
        </div>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@school.edu" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="At least 8 characters" required>
        <div class="form-error" id="error" role="alert"></div>
        <button class="full" type="submit" id="submit">Log in</button>
      </form>
    </div>
    <p class="muted" style="text-align:center;">Taking an exam? Use the link your instructor sent you instead.</p>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  // Only ever go back to a page on this site.
  let next = params.get('next') || '/admin.html';
  if (!next.startsWith('/') || next.startsWith('//')) next = '/admin.html';

  let mode = 'login';
  const $ = id => document.getElementById(id);

  function setMode(m) {
    mode = m;
    const reg = m === 'register';
    $('tab-login').classList.toggle('on', !reg);
    $('tab-register').classList.toggle('on', reg);
    $('name-row').style.display = reg ? 'block' : 'none';
    $('title').textContent = reg ? 'Create your account' : 'Welcome back';
    $('subtitle').textContent = reg
      ? 'Each professor has their own exams and records, separate from everyone else.'
      : "Log in to manage your exams and see your students' sessions.";
    $('submit').textContent = reg ? 'Create account' : 'Log in';
    $('password').autocomplete = reg ? 'new-password' : 'current-password';
    $('error').textContent = '';
  }
  $('tab-login').addEventListener('click', () => setMode('login'));
  $('tab-register').addEventListener('click', () => setMode('register'));

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('error').textContent = '';
    $('submit').disabled = true;
    const body = { email: $('email').value, password: $('password').value };
    if (mode === 'register') { body.name = $('name').value; }
    try {
      const res = await fetch('/api/account/' + mode, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      window.location.href = next;
    } catch (err) {
      $('error').textContent = err.message;
      $('submit').disabled = false;
    }
  });

  // Already logged in? Skip the form.
  fetch('/api/account/me').then(r => { if (r.ok) window.location.href = next; }).catch(() => {});
</script>
</body>
</html>
