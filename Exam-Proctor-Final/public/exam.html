<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Portal</title>
<link rel="stylesheet" href="style.css">
<style>
  #warning-banner {
    display: none; background: #b91c1c; color: #fff; padding: 12px;
    text-align: center; font-weight: 600; position: sticky; top: 0; z-index: 1000;
  }
  .portal-brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 18px; margin-bottom: 22px; }
  #setup-screen { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; text-align: left; }
  #setup-screen .card { padding: 30px; }
  #setup-screen h2 { margin-bottom: 4px; }
  #setup-screen button { width: 100%; margin-top: 18px; padding: 12px; font-size: 15px; }
  #end-session-bar { display: none; text-align: right; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  #end-btn { background: transparent; color: var(--accent); border-color: var(--border-strong); }
  #end-btn:hover { background: var(--surface-2); box-shadow: none; }
  #exam-frame { width: 100%; height: calc(100vh - 56px); border: none; display: none; background: #fff; }
  #ended-screen { display: none; max-width: 460px; margin: 14vh auto 0; padding: 0 20px; text-align: center; }
  #ended-screen .box { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 38px 28px; }
  #ended-screen .check {
    width: 64px; height: 64px; line-height: 64px; margin: 0 auto 18px;
    border-radius: 50%; background: rgba(23, 125, 129, 0.3); color: var(--accent); font-size: 32px; font-weight: bold;
    box-shadow: 0 0 0 8px rgba(23, 125, 129, 0.15);
  }
  #ended-screen p { color: var(--muted); margin: 6px 0; }
</style>
</head>
<body>

  <div id="warning-banner"></div>

  <div id="setup-screen">
    <div class="portal-brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5l8 3v6.2c0 4.7-3.3 8.4-8 9.8-4.7-1.4-8-5.1-8-9.8V5.5l8-3z" fill="#177D81"/><path d="M8.3 12.2l2.7 2.7 4.9-5.3" stroke="#F2FBF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      TestGuard
    </div>
    <div class="card">
      <h2>Exam Portal</h2>
      <p class="muted" style="margin:0 0 4px;">Enter your Student ID to begin. The exam will open in fullscreen.</p>
      <label for="studentIdInput">Student ID</label>
      <input type="text" id="studentIdInput" placeholder="e.g. 2023-00123">
      <button id="start-btn">Start Exam</button>
    </div>
  </div>

  <div id="end-session-bar">
    <button id="end-btn">I've Submitted — End Session</button>
  </div>

  <iframe id="exam-frame"></iframe>

  <div id="ended-screen">
    <div class="box">
      <div class="check">&#10003;</div>
      <h2>Test Session Ended</h2>
      <p>Your exam session has ended and monitoring has stopped.</p>
      <p>You may now close this tab.</p>
    </div>
  </div>

  <script src="proctor.js"></script>
</body>
</html>
