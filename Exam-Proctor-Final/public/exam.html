<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Exam Portal</title>
<style>
  :root {
    --maroon: #7A0C22;
    --maroon-dark: #5C0918;
    --gold: #FFC72C;
    --gold-dark: #D4A017;
  }
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  #warning-banner {
    display: none; background: #dc2626; color: #fff; padding: 12px;
    text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 1000;
  }
  #setup-screen { max-width: 400px; margin: 80px auto; text-align: center; }
  #setup-screen h2 { color: var(--maroon-dark); }
  #setup-screen input {
    width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box;
    font-size: 16px; border: 1px solid #ccc; border-radius: 4px;
  }
  #setup-screen button {
    padding: 10px 24px; background: var(--maroon); color: #fff; border: none;
    border-radius: 4px; cursor: pointer; font-size: 16px;
  }
  #setup-screen button:hover { background: var(--maroon-dark); }
  #end-session-bar { display: none; text-align: right; padding: 10px 20px; }
  #end-btn {
    padding: 10px 24px; background: var(--gold); color: var(--maroon-dark); border: none;
    border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 700;
  }
  #end-btn:hover { background: var(--gold-dark); }
  #exam-frame { width: 100%; height: 85vh; border: none; display: none; }
  #ended-screen { display: none; max-width: 460px; margin: 100px auto; padding: 0 20px; text-align: center; }
  #ended-screen .box {
    background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.15);
    padding: 36px 28px; border-top: 4px solid var(--gold);
  }
  #ended-screen .check {
    width: 64px; height: 64px; line-height: 64px; margin: 0 auto 16px;
    border-radius: 50%; background: var(--maroon); color: var(--gold); font-size: 34px; font-weight: bold;
  }
  #ended-screen h2 { color: var(--maroon-dark); margin: 0 0 10px; }
  #ended-screen p { color: #555; margin: 6px 0; line-height: 1.5; }
</style>
</head>
<body>

  <div id="warning-banner"></div>

  <div id="setup-screen">
    <h2>Exam Portal</h2>
    <label for="studentIdInput">Student ID</label>
    <input type="text" id="studentIdInput" placeholder="e.g. 2023-00123">
    <button id="start-btn">Start Exam</button>
  </div>

  <div id="end-session-bar">
    <button id="end-btn">I've Submitted — End Session</button>
  </div>

  <iframe id="exam-frame"></iframe>

  <div id="ended-screen">
    <div class="box">
      <div class="check">&#10003;</div>
      <h2>Test Session Ended</h2>
      <p>Your exam session has ended and monitoring has stopped.</p>
      <p>You may now close this tab.</p>
    </div>
  </div>

  <script src="proctor.js"></script>
</body>
</html>
