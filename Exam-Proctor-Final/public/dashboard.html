<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — TestGuard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav-root" data-active="dashboard"></div>
<script src="common.js"></script>
<main>
  <div class="page-head">
    <div>
      <h2>Dashboard</h2>
      <p>Every student session for your exams. Click a row to see what was flagged.</p>
    </div>
    <span id="last-updated"></span>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="stat-total">0</div><div class="l">Sessions</div></div>
    <div class="stat live"><div class="n" id="stat-live">0</div><div class="l">Live now</div></div>
    <div class="stat hot"><div class="n" id="stat-high">0</div><div class="l">High risk</div></div>
    <div class="stat"><div class="n" id="stat-violations">0</div><div class="l">Violations</div></div>
  </div>

  <div class="filters">
    <div class="f">
      <label for="filter-exam">Exam</label>
      <select id="filter-exam"><option value="">All exams</option></select>
    </div>
    <div class="f">
      <label for="filter-status">Status</label>
      <select id="filter-status">
        <option value="">All sessions</option>
        <option value="live">Live now</option>
        <option value="ended">Ended</option>
      </select>
    </div>
    <div class="f">
      <label for="filter-risk">Risk</label>
      <select id="filter-risk">
        <option value="">Any risk</option>
        <option value="flagged">Flagged (Low and up)</option>
        <option value="high">High only</option>
        <option value="clean">Clean only</option>
      </select>
    </div>
    <div class="f wide">
      <label for="filter-search">Student ID</label>
      <input type="text" id="filter-search" placeholder="Search a student…">
    </div>
    <div class="f end">
      <button class="ghost" id="clear-filters">Clear</button>
      <button id="refresh-btn">Refresh</button>
      <label><input type="checkbox" id="auto-refresh" checked>Auto-refresh (10s)</label>
    </div>
  </div>

  <div class="table-wrap">
    <table id="sessions-table">
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Exam</th>
          <th>Started</th>
          <th>Ended</th>
          <th>Violations</th>
          <th>Risk</th>
          <th>Proctoring</th>
        </tr>
      </thead>
      <tbody id="sessions-body"></tbody>
    </table>
    <div id="empty-msg" style="display:none;">No exam sessions recorded yet.</div>
  </div>
</main>

<script src="dashboard.js"></script>
</body>
</html>
